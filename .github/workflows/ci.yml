name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run
      - run: pnpm exec tsc -p packages/shared/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/crawl-engine/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/content-engine/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/brand-engine/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/campaign-engine/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/social/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/analytics/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/database/tsconfig.json --noEmit
      - run: pnpm exec tsc -p packages/agents/tsconfig.json --noEmit
      - run: pnpm --filter @morrowlane/web build
