<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Morrowlane Studio</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0c1512; color: #e8f1ed;
           font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { text-align: center; padding: 2rem; max-width: 22rem; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: #0d9488; color: #fff;
            font-size: 28px; font-weight: 800; display: inline-flex; align-items: center;
            justify-content: center; margin-bottom: 1rem; }
    h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
    p { font-size: .9rem; color: #93a8a0; margin: 0 0 1.25rem; line-height: 1.5; }
    button { background: #0d9488; color: #fff; border: 0; border-radius: 10px;
             padding: .7rem 1.4rem; font-size: .9rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">M</div>
    <h1>You’re offline</h1>
    <p>Morrowlane needs a connection to reach your brand, content and calendar.
       Your work is safe on the server.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
